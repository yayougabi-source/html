<script>
    function sendSecurityAlert(lelValue) {
        // هذه الوظيفة تحاكي إرسال رسالة للمدير عبر API
        console.log("إرسال تنبيه أمني: محاولة إصدار تصريح بنسبة غاز " + lelValue + "%");
        
        // في النسخة المتقدمة، نربط هذا بـ EmailJS أو WhatsApp API
        const adminPhone = "+213XXXXXXXXX"; // رقم مدير HSE
        const message = `🚨 تنبيه أمني من Smart HSE: محاولة إصدار تصريح عمل ساخن بنسبة غاز خطيرة (${lelValue}%) في موقع Bloc ADM.`;
        
        // إظهار تنبيه للمستخدم بأنه تم إبلاغ الإدارة
        const errorBox = document.getElementById('error-msg');
        errorBox.innerHTML = `<i class="fas fa-exclamation-triangle ml-2"></i> تم حظر العملية وإرسال تقرير فوري لإدارة السلامة!`;
    }

    function validatePermit() {
        const lelValue = document.getElementById('lel-input').value;
        const errorMsg = document.getElementById('error-msg');

        if (lelValue === "" || lelValue > 0) {
            errorMsg.classList.remove('hidden');
            // استدعاء نظام التنبيه فوراً
            sendSecurityAlert(lelValue || "غير محددة");
        } else {
            alert("✅ تم التحقق بنجاح. التصريح آمن للإصدار.");
            toggleModal();
        }
    }
</script>
