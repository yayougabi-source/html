<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="border-l-4 border-orange-500 pl-4 bg-orange-50 p-4 rounded-r-lg">
    <h4 class="font-bold text-slate-800 mb-3 text-sm italic">3. ÉVALUATION DE RISQUES (Dangers AZ)</h4>
    <div class="grid grid-cols-2 gap-2">
        <label class="flex items-center text-[11px] font-semibold text-slate-700">
            <input type="checkbox" class="mr-2 w-4 h-4 accent-orange-600"> Produits dangereux
        </label>
        <label class="flex items-center text-[11px] font-semibold text-slate-700">
            <input type="checkbox" class="mr-2 w-4 h-4 accent-orange-600"> Haute pression
        </label>
        <label class="flex items-center text-[11px] font-semibold text-slate-700">
            <input type="checkbox" class="mr-2 w-4 h-4 accent-orange-600"> Espace confiné
        </label>
        <label class="flex items-center text-[11px] font-semibold text-slate-700">
            <input type="checkbox" class="mr-2 w-4 h-4 accent-orange-600"> Travail en hauteur
        </label>
        <label class="flex items-center text-[11px] font-semibold text-slate-700">
            <input type="checkbox" class="mr-2 w-4 h-4 accent-orange-600"> Énergie électrique
        </label>
        <label class="flex items-center text-[11px] font-semibold text-slate-700">
            <input type="checkbox" class="mr-2 w-4 h-4 accent-orange-600"> Opération de levage
        </label>
    </div>
</div>
    <title>GTP - Système de Permis Numérique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <nav class="bg-slate-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-red-600 rounded flex items-center justify-center font-bold text-white italic">GTP</div>
                <h1 class="text-lg font-semibold tracking-wide">HSE SMART SYSTEM</h1>
            </div>
            <span class="text-[10px] bg-red-600 px-2 py-1 rounded-full animate-pulse uppercase">V1.0 - Digital PTW</span>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-4">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 uppercase">Tableau de bord des permis</h2>
            <p class="text-gray-500 text-sm mt-1">Sélectionnez le type de travaux à effectuer</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto">
            <button onclick="openPtw()" class="bg-white p-6 rounded-2xl shadow-md border-b-4 border-red-600 hover:shadow-xl transition-all flex flex-col items-center group">
                <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-fire"></i>
                </div>
                <h3 class="font-bold text-slate-700 uppercase">Permis à chaud</h3>
            </button>

            <div class="bg-white p-6 rounded-2xl shadow-md border-b-4 border-blue-500 opacity-60 flex flex-col items-center grayscale">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl mb-4">
                    <i class="fas fa-snowflake"></i>
                </div>
                <h3 class="font-bold text-slate-700 uppercase">Permis à froid</h3>
            </div>
        </div>
    </main>

    <div id="ptwModal" class="hidden fixed inset-0 w-full h-full flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="absolute inset-0 bg-black opacity-70"></div>
        <div class="bg-white w-full max-w-2xl mx-auto rounded-xl shadow-2xl z-50 relative my-10">
            <div class="bg-slate-800 text-white p-4 rounded-t-xl flex justify-between items-center">
                <h3 class="font-bold uppercase tracking-widest text-sm">GTP - PERMIS DE TRAVAIL À CHAUD</h3>
                <button onclick="closePtw()" class="hover:text-red-400"><i class="fas fa-times"></i></button>
            </div>

            <div class="p-6 space-y-6 overflow-y-auto max-h-[70vh]">
                <div class="border-l-4 border-red-600 pl-4">
                    <h4 class="font-bold text-slate-800 mb-2">1. DEMANDE DE PERMIS</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" placeholder="Unité/Zone" class="w-full p-2 border rounded text-sm bg-gray-50">
                        <input type="text" placeholder="Installation/Equipement" class="w-full p-2 border rounded text-sm bg-gray-50">
                    </div>
                </div>

                <div class="bg-red-50 p-4 rounded-lg">
                    <h4 class="font-bold text-red-800 text-sm mb-3 underline">6. CERTIFICAT DE CONTRÔLE D'ATMOSPHÈRE</h4>
                    <div class="flex items-center space-x-4">
                        <label class="font-bold text-xs uppercase">Résultat % LEL:</label>
                        <input type="number" id="lelValue" placeholder="0" class="w-20 p-2 border-2 border-red-300 rounded text-center font-bold text-red-600">
                    </div>
                </div>

                <button onclick="approvePTW()" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition">
                    Approuver et Enregistrer
                </button>
            </div>
        </div>
    </div>

    <script>
        function openPtw() { document.getElementById('ptwModal').classList.remove('hidden'); }
        function closePtw() { document.getElementById('ptwModal').classList.add('hidden'); }
        
        function approvePTW() {
            const lel = document.getElementById('lelValue').value;
            if (lel > 0) {
                alert("❌ ACCÈS REFUSÉ: La limite LEL doit être 0% pour les travaux à chaud.");
            } else {
                alert("✅ PERMIS APPROUVÉ: Enregistrement dans la base de données GTP...");
                closePtw();
            }
        }
    </script>
</body>
</html>
